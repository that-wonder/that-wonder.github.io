<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wonder</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --accent-color: #555555;
            --glow-color: rgba(255, 255, 255, 0.8);
        }

        html {
            background-color: var(--bg-color);
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-transform: lowercase; 
            text-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color);
            /* Adds the subtle, continuous sway */
            animation: sway 12s ease-in-out infinite;
            transform-origin: center center;
        }

        /* Swaying Keyframes */
        @keyframes sway {
            0%, 100% { transform: rotate(-1deg) translate(-5px, -3px); }
            50% { transform: rotate(1deg) translate(5px, 3px); }
        }

        /* Overlay for Autoplay Policy Workaround */
        #enter-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.8s ease;
            background-color: var(--bg-color); /* Kept to hide visualizer before entry */
        }

        .enter-btn {
            background: none;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 15px 40px;
            margin: 20px; 
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: inherit; 
            box-shadow: 0 0 10px var(--glow-color); 
        }

        .enter-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
            text-shadow: none; 
            box-shadow: 0 0 25px var(--glow-color); 
        }

        /* Main Content */
        .container {
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease;
            padding: 30px; 
        }

        h1 {
            font-size: 4rem;
            font-weight: 200;
            letter-spacing: 15px;
            margin: 0;
            margin-right: -15px; 
            padding: 20px 0; 
            line-height: 1.1;
            text-transform: lowercase;
            text-shadow: 0 0 15px var(--glow-color), 0 0 30px var(--glow-color);
        }

        p.subtitle {
            font-size: 1rem;
            letter-spacing: 5px;
            color: var(--accent-color);
            margin: 0 0 40px 0;
            padding: 10px 0; 
            text-transform: lowercase;
            text-shadow: 0 0 8px rgba(85, 85, 85, 0.8);
        }

        .links {
            padding: 20px; 
        }

        .links p {
            padding: 10px 0;
        }

        .links a {
            color: var(--text-color);
            text-decoration: none;
            margin: 0 15px;
            padding: 10px; 
            display: inline-block; 
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            text-transform: lowercase;
        }

        .links a:hover {
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(85, 85, 85, 0.8);
        }

        /* Visualizer Animation */
        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 50px; 
            gap: 5px;
            margin-top: 40px;
            padding: 10px;
        }

        .bar {
            width: 4px;
            background-color: var(--text-color);
            height: 5px;
            animation: bounce 1.5s infinite ease-in-out;
            box-shadow: 0 0 8px var(--glow-color);
        }

        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        .bar:nth-child(4) { animation-delay: 0.2s; }

        @keyframes bounce {
            0%, 100% { height: 5px; }
            50% { height: 35px; }
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <div id="enter-screen">
        <button class="enter-btn" onclick="enterSite()">click to enter</button>
    </div>

    <div class="container" id="main-content">
        <h1>wonder</h1>
        <p class="subtitle">i make beats n shit</p>
        
        <div class="links">
            <p>stream songs i produced</p>
            <a href="https://open.spotify.com/track/1gMhJdd5NNpZaam9uBjcPq">leyla</a>
            <a href="https://open.spotify.com/track/5rfcPRTqp12TlbPTCIJX5N">what about me</a>
            <p>thats all for now (please use my beats)</p>
            <p>dm me on discord if you want a beat</p>
            <p> my user is that.wonder</p>
        </div>

        <div class="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <audio id="bg-audio" loop>
        <source src="beat.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        function enterSite() {
            const enterScreen = document.getElementById('enter-screen');
            enterScreen.style.opacity = '0';
            
            const mainContent = document.getElementById('main-content');
            mainContent.style.opacity = '1';
            
            const audio = document.getElementById('bg-audio');
            audio.volume = 0.5; 
            audio.play().catch(error => {
                console.log("Audio playback was prevented by the browser.");
            });

            setTimeout(() => {
                enterScreen.style.display = 'none';
            }, 800);
        }
    </script>
</body>
</html>
