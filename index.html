<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wonder</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --accent-color: #555555;
            --glow-color: rgba(255, 255, 255, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-transform: lowercase; /* Forces all text to lowercase */
            text-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color); /* Adds the glow effect */
        }

        /* Overlay for Autoplay Policy Workaround */
        #enter-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        .enter-btn {
            background: none;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 15px 40px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: inherit; /* Inherits the glow from body */
            box-shadow: 0 0 10px var(--glow-color); /* Adds a glow to the button border */
        }

        .enter-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
            text-shadow: none; /* Removes text glow when inverted for better readability */
            box-shadow: 0 0 20px var(--glow-color); /* Enhances border glow on hover */
        }

        /* Main Content */
        .container {
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        h1 {
            font-size: 4rem;
            font-weight: 200;
            letter-spacing: 15px;
            margin: 0 0 10px 0;
            margin-right: -15px; /* Offset for letter spacing */
            text-transform: lowercase;
            text-shadow: 0 0 15px var(--glow-color), 0 0 30px var(--glow-color); /* Slightly stronger glow for the title */
        }

        p.subtitle {
            font-size: 1rem;
            letter-spacing: 5px;
            color: var(--accent-color);
            margin-bottom: 40px;
            text-transform: lowercase;
            text-shadow: 0 0 8px rgba(85, 85, 85, 0.8); /* Darker glow for the accent color */
        }

        .links a {
            color: var(--text-color);
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            text-transform: lowercase;
        }

        .links a:hover {
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(85, 85, 85, 0.8); /* Changes glow color on hover */
        }

        /* Visualizer Animation (Optional aesthetic) */
        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 40px;
            gap: 5px;
            margin-top: 50px;
        }

        .bar {
            width: 4px;
            background-color: var(--text-color);
            height: 5px;
            animation: bounce 1.5s infinite ease-in-out;
            box-shadow: 0 0 8px var(--glow-color); /* Adds glow to the visualizer bars */
        }

        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        .bar:nth-child(4) { animation-delay: 0.2s; }

        @keyframes bounce {
            0%, 100% { height: 5px; }
            50% { height: 35px; }
        }

        /* Hide audio player */
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Enter Screen -->
    <div id="enter-screen">
        <button class="enter-btn" onclick="enterSite()">click to enter</button>
    </div>

    <!-- Main Site -->
    <div class="container" id="main-content">
        <h1>wonder</h1>
        <p class="subtitle">i make beats n shit</p>
        
        <div class="links">
            <p>stream songs i produced</p>
            <a href="https://open.spotify.com/track/1gMhJdd5NNpZaam9uBjcPq">leyla</a>
            <a href="https://open.spotify.com/track/5rfcPRTqp12TlbPTCIJX5N">what about me</a>
            <p>thats all for now (please use my beats)</p>
        </div>

        <div class="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <!-- Background Audio -->
    <!-- Replace "beat.mp3" with the actual name of your audio file -->
    <audio id="bg-audio" loop>
        <source src="beat.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        function enterSite() {
            // Hide enter screen
            const enterScreen = document.getElementById('enter-screen');
            enterScreen.style.opacity = '0';
            
            // Show main content
            const mainContent = document.getElementById('main-content');
            mainContent.style.opacity = '1';
            
            // Play audio
            const audio = document.getElementById('bg-audio');
            audio.volume = 0.5; // Set volume to 50%
            audio.play().catch(error => {
                console.log("Audio playback was prevented by the browser.");
            });

            // Remove enter screen from DOM after transition
            setTimeout(() => {
                enterScreen.style.display = 'none';
            }, 800);
        }
    </script>
</body>
</html>
